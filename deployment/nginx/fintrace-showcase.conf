server {
    listen 80;
    server_name fintrace.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fintrace.example.com;

    ssl_certificate /etc/letsencrypt/live/fintrace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fintrace.example.com/privkey.pem;

    auth_basic "FinTrace Showcase";
    auth_basic_user_file /etc/nginx/fintrace.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
